
<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script>
        // JavaScript to handle form submission
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            form.addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent the default form submission
                const username = form.querySelector('input[type="text"]').value;
                const password = form.querySelector('input[type="password"]').value;
                
                // Here you can add your authentication logic
                if (username === 'admin' && password === 'password') {
                    alert('Login successful!');
                    // Redirect to another page or perform other actions
                } else {
                    alert('Invalid username or password. Please try again.');
                }
            });
        });
        // add one more constraint to the above code that the username should be at least 5 characters long and the password should be at least 8 characters long. If the constraints are not met, display an appropriate error message to the user.
            document.addEventListener('DOMContentLoaded', function() {
                const form = document.querySelector('form');
                form.addEventListener('submit', function(event) {
                    event.preventDefault(); // Prevent the default form submission
                    const username = form.querySelector('input[type="text"]').value;
                    const password = form.querySelector('input[type="password"]').value;
                    
                    if (username.length < 5) {
                        alert('Username must be at least 5 characters long.');
                        return;
                    }
                    
                    if (password.length < 8) {
                        alert('Password must be at least 8 characters long.');
                        return;
                    }
                    
                    // Here you can add your authentication logic
                    if (username === 'admin' && password === 'password') {
                        alert('Login successful!');
                        // Redirect to another page or perform other actions
                    } else {
                        alert('Invalid username or password. Please try again.');
                    }
                });
            });
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .login-container h2 {
            margin-bottom: 20px;
        }
        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .login-container button:hover {
            background-color: #0056b3;
        }
    </style></head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body> 
</html>
